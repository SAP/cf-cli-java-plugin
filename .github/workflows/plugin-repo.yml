name: Generate Plugin Repository Entry

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate-plugin-repo:
    name: Generate Plugin Repository YAML
    # The main release workflow normally uploads these assets itself.
    if: ${{ !contains(github.event.release.assets.*.name, 'plugin-repo-entry.yml') || !contains(github.event.release.assets.*.name, 'plugin-repo-summary.txt') }}
    runs-on: ubuntu-latest
    environment: release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout release tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-tools
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML requests

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p dist
          # Download all release assets
          gh release download "$TAG" -D dist/

      - name: Generate plugin repository YAML
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 release-tools/.github/workflows/generate_plugin_repo.py "$TAG"

      - name: Upload plugin repository files to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" plugin-repo-entry.yml plugin-repo-summary.txt --clobber

      - name: Create PR to plugin repository (optional)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Plugin repository entry generated!"
          echo "To submit to CF CLI plugin repository:"
          echo "1. Fork https://github.com/cloudfoundry-incubator/cli-plugin-repo"
          echo "2. Add the contents of plugin-repo-entry.yml to repo-index.yml"
          echo "3. Create a pull request"
          echo ""
          echo "Entry content:"
          cat plugin-repo-entry.yml
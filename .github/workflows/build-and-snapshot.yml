name: Build, Test and Snapshot Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read

jobs:
  lint-and-test-python:
    name: Lint Python Test Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Python test environment
        run: |
          cd test
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python linting
        run: |
          cd test
          source venv/bin/activate
          ../scripts/lint-python.sh ci

  build:
    name: Build and Test Go Plugin
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: [">=1.23.5"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download JStall minimal JAR for go:embed
        shell: bash
        run: |
          mkdir -p dist
          curl -fsSL -o dist/jstall-minimal.jar https://github.com/parttimenerd/jstall/releases/latest/download/jstall-minimal.jar
          ls -lh dist/jstall-minimal.jar

      - name: Install dependencies
        run: go mod tidy -e || true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run govulncheck
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Run in JSON mode and emit GitHub Actions warning annotations for each finding.
          # govulncheck outputs multi-line JSON objects (not line-delimited), so we use
          # raw_decode to parse successive top-level objects from the output stream.
          govulncheck -json . 2>/dev/null | python3 -c "
          import sys, json
          decoder = json.JSONDecoder()
          data = sys.stdin.read().strip()
          pos = 0
          while pos < len(data):
              obj, idx = decoder.raw_decode(data, pos)
              pos = idx
              while pos < len(data) and data[pos] in ' \t\n\r':
                  pos += 1
              if not isinstance(obj, dict):
                  continue
              finding = obj.get('finding')
              if not finding:
                  continue
              osv_id = finding.get('osv', '')
              traces = finding.get('trace', [])
              mod = traces[0].get('module', '') if traces else ''
              ver = traces[0].get('version', '') if traces else ''
              fixed = finding.get('fixed_version', '')
              summary = f'{mod} {ver} is vulnerable ({osv_id}); fixed in {fixed}' if fixed else osv_id
              loc = ''
              for frame in reversed(traces):
                  fpos = frame.get('position', {})
                  fname = fpos.get('filename', '')
                  line_no = fpos.get('line', '')
                  if fname:
                      loc = f'file={fname},line={line_no},'
                      break
              print(f'::warning {loc}title=govulncheck [{osv_id}]::{summary}')
          " || true

      - name: Lint and format Go files
        run: ./scripts/lint-go.sh ci

      - name: Build binary
        run: |
          echo "🔨 Building binary..."
          python3 .github/workflows/build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cf-cli-java-plugin-${{ matrix.os }}
          path: |
            dist/*
            !dist/jstall-minimal.jar

  release:
    name: Create Snapshot Release
    needs: [build, lint-and-test-python]
    runs-on: ubuntu-latest
    environment: release
    if: (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.lint-and-test-python.result == 'success' || needs.lint-and-test-python.result == 'skipped')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies for plugin repo generation
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/

      - name: Combine all artifacts
        run: |
          mkdir -p dist
          mv dist/*/* dist/ || true

      - name: Generate plugin repository YAML for snapshot
        env:
          GITHUB_REF_NAME: snapshot
        run: |
          echo "📝 Generating plugin repository YAML file..."
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install --upgrade pip
          pip install PyYAML requests
          python3 .github/workflows/generate_plugin_repo.py $GITHUB_REF_NAME
          echo "✅ Plugin repository YAML generated"

      - name: Generate timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Get JStall version
        id: jstall
        run: |
          JSTALL_VERSION=$(curl -s https://api.github.com/repos/parttimenerd/jstall/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name','unknown'))")
          echo "version=$JSTALL_VERSION" >> $GITHUB_OUTPUT

      - uses: thomashampson/delete-older-releases@2ff234dfe6ad2757ac7e53d96e298fbe82b0fd56 # @main
        with:
          keep_latest: 0
          delete_tag_regex: snapshot
          prerelease_only: true
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete and regenerate tag snapshot
        run: |
          echo "Deleting existing snapshot tag..."
          git tag -d snapshot || true
          git push origin :snapshot || true
          echo "Regenerating snapshot tag..."
          git tag snapshot
          git push origin snapshot --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            dist/*
            plugin-repo-entry.yml
            plugin-repo-summary.txt
          prerelease: false
          draft: false
          tag_name: snapshot
          body: |
            This is a snapshot release of the cf-cli-java-plugin.
            It includes the latest changes and is not intended for production use.
            Please test it and provide feedback.

            **Build Timestamp**: ${{ steps.timestamp.outputs.timestamp }}

            **Bundled JStall version**: [${{ steps.jstall.outputs.version }}](https://github.com/parttimenerd/jstall/releases/tag/${{ steps.jstall.outputs.version }})

            > **Tip:** You can also use a newer JStall version directly via `jstall --cf APP_NAME COMMAND`
            > (see [JStall README](https://github.com/parttimenerd/jstall#usage)).

            ## Installation

            Download the current snapshot release and install manually:

            ```sh
            # on Mac arm64
            cf install-plugin https://github.com/SAP/cf-cli-java-plugin/releases/download/snapshot/cf-cli-java-plugin-macos-arm64
            # on Windows amd64
            cf install-plugin https://github.com/SAP/cf-cli-java-plugin/releases/download/snapshot/cf-cli-java-plugin-windows-amd64.exe
            # on Linux amd64
            cf install-plugin https://github.com/SAP/cf-cli-java-plugin/releases/download/snapshot/cf-cli-java-plugin-linux-amd64
            ```

            **Note:** On Linux and macOS, if you get a permission error, run `chmod +x [cf-cli-java-plugin]` on the plugin binary.

            You can verify that the plugin is successfully installed by looking for `java` in the output of `cf plugins`.
            
          name: Snapshot Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
